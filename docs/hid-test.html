<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebHID 列挙テスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, 'Segoe UI', sans-serif;
    background: #12161f;
    color: #e6edf3;
    line-height: 1.7;
    padding: 18px 16px 40px;
    font-size: 16px;
  }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .sub { color: #8b98a5; font-size: 0.85rem; margin-bottom: 20px; }

  .box {
    background: #1b2130;
    border: 1px solid #2c3648;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .box h2 {
    font-size: 0.8rem; letter-spacing: 0.08em;
    color: #8b98a5; font-weight: 700;
    margin-bottom: 10px;
  }

  .row {
    display: flex; gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #252e3e;
  }
  .row:last-child { border-bottom: none; }
  .k { flex: 0 0 42%; color: #8b98a5; font-size: 0.85rem; }
  .v {
    flex: 1; min-width: 0; word-break: break-all;
    font-family: 'Consolas', monospace; font-size: 0.9rem;
  }
  .ok { color: #3fd68a; }
  .ng { color: #ff6b6b; }

  button {
    display: block; width: 100%;
    padding: 18px; margin-bottom: 16px;
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    color: #06231a; background: #3fd68a;
    border: none; border-radius: 10px;
    cursor: pointer;
  }
  button:active { background: #35b876; }
  button:disabled { background: #3a4456; color: #8b98a5; }

  #log { min-height: 40px; }
  .empty { color: #8b98a5; font-size: 0.88rem; }
  .err .k { color: #ff9b9b; }
</style>
</head>
<body>

<h1>WebHID 列挙テスト</h1>
<div class="sub">絞り込みなし（filters: []）でデバイス選択を出します。</div>

<div class="box">
  <h2>この環境</h2>
  <div class="row"><div class="k">navigator.hid</div><div class="v" id="hasHid">-</div></div>
  <div class="row"><div class="k">window.isSecureContext</div><div class="v" id="secure">-</div></div>
  <div class="row"><div class="k">location.protocol</div><div class="v" id="proto">-</div></div>
  <div class="row"><div class="k">userAgent</div><div class="v" id="ua">-</div></div>
</div>

<button id="pick">HID デバイスを選択</button>

<div class="box">
  <h2>結果</h2>
  <div id="log"><div class="empty">まだ実行していません。</div></div>
</div>

<script>
  var hasHid = ('hid' in navigator);

  var elHasHid = document.getElementById('hasHid');
  elHasHid.textContent = hasHid ? 'あり' : 'なし';
  elHasHid.className = 'v ' + (hasHid ? 'ok' : 'ng');

  var elSecure = document.getElementById('secure');
  elSecure.textContent = String(window.isSecureContext);
  elSecure.className = 'v ' + (window.isSecureContext ? 'ok' : 'ng');

  document.getElementById('proto').textContent = location.protocol;
  document.getElementById('ua').textContent = navigator.userAgent;

  var log = document.getElementById('log');
  var btn = document.getElementById('pick');

  function clear() { log.textContent = ''; }

  function line(key, value, cls) {
    var row = document.createElement('div');
    row.className = 'row' + (cls ? ' ' + cls : '');
    var k = document.createElement('div');
    k.className = 'k';
    k.textContent = key;
    var v = document.createElement('div');
    v.className = 'v';
    v.textContent = value;
    row.appendChild(k);
    row.appendChild(v);
    log.appendChild(row);
  }

  function note(text, cls) {
    var d = document.createElement('div');
    d.className = 'empty' + (cls ? ' ' + cls : '');
    d.textContent = text;
    log.appendChild(d);
  }

  function hex(n) {
    return '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  }

  if (!hasHid) {
    btn.disabled = true;
    btn.textContent = 'navigator.hid がありません';
  }

  btn.addEventListener('click', async function () {
    clear();
    btn.disabled = true;
    try {
      var devices = await navigator.hid.requestDevice({ filters: [] });

      if (!devices || devices.length === 0) {
        note('選ばれたデバイスは 0 件でした。一覧に出なかったか、キャンセルされました。');
      } else {
        for (var i = 0; i < devices.length; i++) {
          var d = devices[i];
          if (devices.length > 1) { note('デバイス ' + (i + 1)); }
          line('productName', d.productName === '' ? '(空文字)' : String(d.productName));
          line('vendorId', d.vendorId + '  ' + hex(d.vendorId));
          line('productId', d.productId + '  ' + hex(d.productId));
        }
      }
    } catch (e) {
      line('error.name', e && e.name ? e.name : '(なし)', 'err');
      line('error.message', e && e.message ? e.message : '(なし)', 'err');
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
