<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebHID 列挙テスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, 'Segoe UI', sans-serif;
    background: #12161f;
    color: #e6edf3;
    line-height: 1.7;
    padding: 18px 16px 40px;
    font-size: 16px;
  }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .sub { color: #8b98a5; font-size: 0.85rem; margin-bottom: 20px; }

  .box {
    background: #1b2130;
    border: 1px solid #2c3648;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .box h2 {
    font-size: 0.8rem; letter-spacing: 0.08em;
    color: #8b98a5; font-weight: 700;
    margin-bottom: 10px;
  }

  .row {
    display: flex; gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #252e3e;
  }
  .row:last-child { border-bottom: none; }
  .k { flex: 0 0 42%; color: #8b98a5; font-size: 0.85rem; }
  .v {
    flex: 1; min-width: 0; word-break: break-all;
    font-family: 'Consolas', monospace; font-size: 0.9rem;
  }
  .ok { color: #3fd68a; }
  .ng { color: #ff6b6b; }

  button {
    display: block; width: 100%;
    padding: 18px; margin-bottom: 16px;
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    color: #06231a; background: #3fd68a;
    border: none; border-radius: 10px;
    cursor: pointer;
  }
  button:active { background: #35b876; }
  button:disabled { background: #3a4456; color: #8b98a5; }

  #log, #known { min-height: 24px; }
  .empty { color: #8b98a5; font-size: 0.88rem; }
  .err .k { color: #ff9b9b; }

  .sub2 { color: #8b98a5; font-size: 0.8rem; margin: -6px 0 10px; }
  .sub-btn {
    margin: 12px 0 0;
    padding: 10px; font-size: 0.88rem;
    color: #e6edf3; background: #2c3648;
  }
  .sub-btn:active { background: #384459; }
  .dev-head {
    color: #7aa2f7; font-size: 0.85rem; font-weight: 700;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid #2c3648;
  }
  .dev-head:first-child { margin-top: 0; padding-top: 0; border-top: none; }
</style>
</head>
<body>

<h1>WebHID 列挙テスト</h1>
<div class="sub">絞り込みなし（filters: []）でデバイス選択を出します。</div>

<div class="box">
  <h2>この環境</h2>
  <div class="row"><div class="k">navigator.hid</div><div class="v" id="hasHid">-</div></div>
  <div class="row"><div class="k">window.isSecureContext</div><div class="v" id="secure">-</div></div>
  <div class="row"><div class="k">location.protocol</div><div class="v" id="proto">-</div></div>
  <div class="row"><div class="k">userAgent</div><div class="v" id="ua">-</div></div>
</div>

<div class="box">
  <h2>① 許可済みの機器（getDevices）</h2>
  <div class="sub2">ボタンを押さなくても、このページを開いた時点で分かります。</div>
  <div id="known"><div class="empty">読み込み中…</div></div>
  <button id="again" class="sub-btn">もう一度調べる</button>
</div>

<button id="pick">② HID デバイスを選択（ダイアログを出す）</button>

<div class="box">
  <h2>② の結果</h2>
  <div id="log"><div class="empty">まだ実行していません。</div></div>
</div>

<script>
  var hasHid = ('hid' in navigator);

  var elHasHid = document.getElementById('hasHid');
  elHasHid.textContent = hasHid ? 'あり' : 'なし';
  elHasHid.className = 'v ' + (hasHid ? 'ok' : 'ng');

  var elSecure = document.getElementById('secure');
  elSecure.textContent = String(window.isSecureContext);
  elSecure.className = 'v ' + (window.isSecureContext ? 'ok' : 'ng');

  document.getElementById('proto').textContent = location.protocol;
  document.getElementById('ua').textContent = navigator.userAgent;

  var log = document.getElementById('log');
  var known = document.getElementById('known');
  var btn = document.getElementById('pick');
  var againBtn = document.getElementById('again');

  function line(host, key, value, cls) {
    var row = document.createElement('div');
    row.className = 'row' + (cls ? ' ' + cls : '');
    var k = document.createElement('div');
    k.className = 'k';
    k.textContent = key;
    var v = document.createElement('div');
    v.className = 'v';
    v.textContent = value;
    row.appendChild(k);
    row.appendChild(v);
    host.appendChild(row);
  }

  function note(host, text, cls) {
    var d = document.createElement('div');
    d.className = 'empty' + (cls ? ' ' + cls : '');
    d.textContent = text;
    host.appendChild(d);
  }

  function head(host, text) {
    var d = document.createElement('div');
    d.className = 'dev-head';
    d.textContent = text;
    host.appendChild(d);
  }

  function hex(n) {
    return '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  }

  // 正常側の基準値は pages=[ff00]。突き合わせられるよう usagePage を並べる
  function pagesOf(device) {
    var cols = device.collections || [];
    if (cols.length === 0) { return '(なし)'; }
    var out = [];
    for (var i = 0; i < cols.length; i++) {
      var p = cols[i].usagePage;
      var u = cols[i].usage;
      out.push(hex(p) + '/' + hex(u));
    }
    return out.join('  ');
  }

  function show(host, devices) {
    for (var i = 0; i < devices.length; i++) {
      var d = devices[i];
      if (devices.length > 1) { head(host, 'デバイス ' + (i + 1)); }
      line(host, 'productName', d.productName === '' ? '(空文字)' : String(d.productName));
      line(host, 'vendorId', d.vendorId + '  ' + hex(d.vendorId));
      line(host, 'productId', d.productId + '  ' + hex(d.productId));
      line(host, 'usagePage/usage', pagesOf(d));
      line(host, 'collections 数', String((d.collections || []).length));
    }
  }

  async function listKnown() {
    known.textContent = '';
    if (!hasHid) {
      note(known, 'navigator.hid がありません。');
      return;
    }
    try {
      var devices = await navigator.hid.getDevices();
      if (!devices || devices.length === 0) {
        note(known, '0 件。このブラウザはまだどの HID 機器にも許可を与えていません。');
      } else {
        note(known, devices.length + ' 件');
        show(known, devices);
      }
    } catch (e) {
      line(known, 'error.name', e && e.name ? e.name : '(なし)', 'err');
      line(known, 'error.message', e && e.message ? e.message : '(なし)', 'err');
    }
  }

  if (!hasHid) {
    btn.disabled = true;
    btn.textContent = 'navigator.hid がありません';
    againBtn.disabled = true;
  }

  againBtn.addEventListener('click', listKnown);

  btn.addEventListener('click', async function () {
    log.textContent = '';
    btn.disabled = true;
    try {
      var devices = await navigator.hid.requestDevice({ filters: [] });

      if (!devices || devices.length === 0) {
        note(log, '選ばれたデバイスは 0 件でした。一覧に出なかったか、キャンセルされました。');
      } else {
        show(log, devices);
      }
    } catch (e) {
      line(log, 'error.name', e && e.name ? e.name : '(なし)', 'err');
      line(log, 'error.message', e && e.message ? e.message : '(なし)', 'err');
    } finally {
      btn.disabled = false;
      listKnown();
    }
  });

  listKnown();
</script>

</body>
</html>
